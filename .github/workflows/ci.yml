name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "Checking project files..."
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files are present."

      - name: Build project
        run: |
          echo "Building static web application..."
          mkdir -p build
          cp index.html build/
          cp style.css build/
          cp script.js build/
          echo "Build completed successfully."

      - name: Run tests
        run: |
          echo "Running basic application tests..."
          grep -q "DevOps Automation WebApp" index.html
          grep -q "CI/CD Pipeline" script.js
          echo "All tests passed."

      - name: Generate build logs
        run: |
          echo "================================="
          echo "CI/CD BUILD SUMMARY"
          echo "================================="
          echo "Project: DevOps Automation WebApp"
          echo "Build Status: SUCCESS"
          echo "Files checked: index.html, style.css, script.js"
          echo "Deployment-ready build generated."

      - name: Send Slack success notification
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"✅ CI/CD Pipeline SUCCESS for DevOps WebApp"}' \
          "$SLACK_WEBHOOK_URL"

      - name: Send Slack failure notification
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"❌ CI/CD Pipeline FAILED for DevOps WebApp"}' \
          "$SLACK_WEBHOOK_URL"
